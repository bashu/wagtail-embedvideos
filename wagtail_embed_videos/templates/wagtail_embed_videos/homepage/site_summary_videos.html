{% load i18n wagtailadmin_tags %}

<li>
  {% icon name="media" %}
  <a href="{% url 'wagtail_embed_videos:index' %}">
    {% blocktrans trimmed count counter=total_videos with total_videos|intcomma as total %}
      {{ total }} Embed Video <span class="w-sr-only">created in {{ site_name }}</span>
    {% plural %}
      {{ total }} Embed Videos <span class="w-sr-only">created in {{ site_name }}</span>
    {% endblocktrans %}
  </a>
</li>
