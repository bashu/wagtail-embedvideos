{% extends "wagtailadmin/widgets/chooser.html" %}

{% block chosen_icon %}
  {# Empty alt because the chosen item's title is already displayed next to the preview. #}
  <img class="chooser__image show-transparency"
       data-chooser-image
       alt=""
       decoding="async"
       height="{{ preview.height }}"
       src="{{ preview.url }}"
       width="{{ preview.width }}" />
{% endblock chosen_icon %}
