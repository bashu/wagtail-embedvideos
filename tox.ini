[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{310,311,312,313}-dj51-wt63
    py{310,311,312,313}-dj{51,52}-wt70
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-dj51-wt63, py310-dj{51,52}-wt70
    3.11 = py311-dj51-wt63, py311-dj{51,52}-wt70
    3.12 = py312-dj51-wt63, py312-dj{51,52}-wt70
    3.13 = py313-dj51-wt63, py313-dj{51,52}-wt70

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_embed_videos.tests.settings
deps =
    --only-binary=pillow-heif
    dj51: django>=5.1,<5.2
    dj52: django>=5.2,<5.3
    wt63: wagtail>=6.3,<6.4
    wt70: wagtail>=7.0,<7.1
commands =
    pytest {posargs}
