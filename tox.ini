[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{310,311}-dj{42,50}-wt52
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-dj{42,50}-wt52
    3.11 = py311-dj{42,50}-wt52

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_embed_videos.tests.settings
deps =
    --only-binary=pillow-heif
    dj42: django>=4.2,<4.3
    dj50: django>=5.0,<5.1
    wt52: wagtail>=5.2,<5.3
commands =
    pytest {posargs}
