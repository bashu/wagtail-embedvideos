[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{310,311}-dj42-wt51
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-dj42-wt51
    3.11 = py311-dj42-wt51

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_embed_videos.tests.settings
deps =
    dj42: django>=4.2,<4.3
    wt51: wagtail>=5.1,<5.2
commands =
    pytest {posargs}
