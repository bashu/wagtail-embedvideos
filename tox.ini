[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{38,39,310}-dj32-wt40
    py{38,39,310}-dj40-wt40
skip_missing_interpreters = true

[gh]
python =
    3.8 = py38-dj32-wt40, py38-dj40-wt40
    3.9 = py39-dj32-wt40, py39-dj40-wt40
    3.10 = py310-dj32-wt40, py310-dj40-wt40

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_embed_videos.tests.settings
deps =
    dj32: django>=3.2,<3.3
    dj40: django>=4.0,<4.1
    wt40: wagtail>=4.0,<4.1
commands =
    pytest {posargs}
