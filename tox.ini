[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{310,311,312}-dj50-wt62
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-dj50-wt62
    3.11 = py311-dj50-wt62
    3.12 = py312-dj50-wt62

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtail_embed_videos.tests.settings
deps =
    --only-binary=pillow-heif
    dj50: django>=5.0,<5.1
    wt62: wagtail>=6.2,<6.3
commands =
    pytest {posargs}
